name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Website (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: my-website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  functions:
    name: Edge functions (deno)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check edge functions
        run: >-
          deno check
          supabase/functions/sync-monday/index.ts
          supabase/functions/sync-clockify/index.ts
          supabase/functions/calculate-all-metrics/index.ts
