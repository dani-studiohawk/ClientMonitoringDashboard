name: Deploy edge functions

# Deploys the Supabase edge functions when a change to them reaches main, so
# the live functions always match the repo. Needs the repository secret
# SUPABASE_ACCESS_TOKEN (Settings -> Secrets and variables -> Actions).
# Database migrations are NOT applied here: run them in the SQL editor first.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check the access token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret to enable automatic deploys."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check before deploying
        run: >-
          deno check
          supabase/functions/sync-monday/index.ts
          supabase/functions/sync-clockify/index.ts
          supabase/functions/calculate-all-metrics/index.ts
      - uses: supabase/setup-cli@v1
        with:
          version: 2.67.1  # pinned; bump deliberately
      - name: Deploy
        run: >-
          supabase functions deploy sync-monday sync-clockify calculate-all-metrics
          --project-ref ylnrkfpchrzvuhqrnwco --no-verify-jwt --use-api
